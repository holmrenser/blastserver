# Local / single-host stack. All service config is set
# explicitly here using Compose service-name DNS (`postgres`, `redis`) and
# in-container paths; `${VAR:-default}` is only used for host-side bind paths
# and the published port, so `docker compose up --build` works out of the box.
name: ${NAME:-blastserver}

x-db-url: &db-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-blastserver}?schema=public

services:
  postgres:
    image: postgres:15.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blastserver}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # COPY runs server-side, so the taxonomy file must live on the DB host.
      - ./taxonomy:/app/taxonomy:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-blastserver}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.0
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations and seeds taxonomy, then exits. Everything else
  # waits for it to complete so no replica races on the schema.
  migrate:
    # Pin to amd64 so dev (Rosetta on Apple Silicon) matches amd64 prod nodes,
    # and Prisma's x64 binaryTargets / `native` engine line up. See README.
    platform: linux/amd64
    build:
      context: .
      dockerfile: app.Dockerfile
    image: blastserver_app:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-url
      TAXONOMY_FILE: /app/taxonomy/taxonomy.tsv
    command: ["npm", "run", "migrate:deploy"]
    restart: "no"

  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: app.Dockerfile
    image: blastserver_app:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      <<: *db-url
      JOBQUEUE_HOST: redis
      JOBQUEUE_PORT: "6379"

  blastworker:
    # Required: the BLAST+ binaries in the image are x86_64.
    platform: linux/amd64
    build:
      context: .
      dockerfile: worker.Dockerfile
    image: blastserver_worker:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    environment:
      <<: *db-url
      JOBQUEUE_HOST: redis
      JOBQUEUE_PORT: "6379"
      APP_BLAST_DB_PATH: /blastdb
      NUM_BLAST_THREADS: ${NUM_BLAST_THREADS:-4}
    volumes:
      - "${BLAST_DB_PATH:-./blastdb}:/blastdb:ro"
    # Exec form + single process so SIGTERM reaches Node for graceful drain.
    command: ["node", "worker/build/worker/blastworker.js"]

  downloadworker:
    platform: linux/amd64
    image: blastserver_worker:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    environment:
      <<: *db-url
      JOBQUEUE_HOST: redis
      JOBQUEUE_PORT: "6379"
      APP_BLAST_DB_PATH: /blastdb
    volumes:
      - "${BLAST_DB_PATH:-./blastdb}:/blastdb:ro"
    command: ["node", "worker/build/worker/downloadworker.js"]

volumes:
  pgdata:
