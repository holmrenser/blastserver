name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres for the integration tests. It also backs the job queue
    # (pg-boss), though the integration tests stub the queue.
    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blastserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blastserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blastserver?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      # Typecheck + build the worker bundle and the standalone app.
      - run: npm run build:worker
      - run: npm run build:app:prod
      # Unit tests (jsdom) then integration tests (Node + the Postgres service).
      - run: npm test
      - run: npm run test:integration

  images:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Immutable, reproducible tags by commit SHA — never :latest in prod.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker.Dockerfile
          # x86_64 only: the BLAST+ binaries are x64-linux.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
