name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      # Typecheck + build the worker bundle and the standalone app.
      - run: npm run build:worker
      - run: npm run build:app:prod
      - run: npm test -- --passWithNoTests

  images:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Immutable, reproducible tags by commit SHA — never :latest in prod.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker.Dockerfile
          # x86_64 only: the BLAST+ binaries are x64-linux.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
