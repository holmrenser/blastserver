# Dev-only overlay. Publishes the Postgres port to the host so a host-run
# `next dev` (and the host worker scripts) can reach it — the base compose file
# only `expose`s it network-internally. The job queue runs on Postgres
# (pg-boss), so no Redis port needs publishing. Use with:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     up postgres migrate blastworker downloadworker
#
# i.e. bring up everything EXCEPT `app`, then run `npm run dev:app` on the host
# for hot reloading at http://localhost:3000.
services:
  postgres:
    ports:
      - "5432:5432"
